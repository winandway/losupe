# EL RELOJ DEL DIARIO.
#
# El robot se despertaba de dos formas y ninguna era fiable: el cron de la plataforma no llegó a
# dispararse ni una vez, y el «latido» depende de que alguien visite el sitio — a las siete de la
# mañana no entra nadie. El 24 y el 25 de agosto de 2026 el diario no publicó por esto.
#
# Esto es un reloj de verdad: GitHub dispara a su hora, pase lo que pase, y espera a que la nota
# termine de escribirse (`wait=1`), así el worker no muere a media faena por no tener quien espere.
name: robot

on:
  schedule:
    # CADA HORA, y no en las horas exactas de las franjas. Motivo medido el 29 ago 2026: los cron de
    # GitHub se retrasan mucho y de forma irregular — de ocho disparos diarios programados llegaban
    # uno o dos, con horas de desfase. Disparando cada hora, cada ventana de tres horas recibe varios
    # intentos y basta con que llegue uno.
    #
    # No hay riesgo de nota doble: el turno se apunta por franja y día local, así que los disparos
    # de más encuentran el turno hecho y se van en milisegundos. Y fuera de franja no se publica.
    # El repositorio es público, así que estas ejecuciones no cuestan nada.
    - cron: "7 * * * *"
  workflow_dispatch: # y a mano desde la pestaña Actions, cuando haga falta

# Si una corrida anterior sigue viva, no se lanza otra encima.
concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Escribir la nota del turno
        run: |
          set -o pipefail
          echo "Hora UTC: $(date -u +%H:%M)"
          RESP=$(curl -sS -m 300 \
            -H "x-yad-cron: github-actions" \
            ${CRON_SECRET:+--url-query "key=$CRON_SECRET"} \
            "https://losupe.com/__scheduled?wait=1")
          echo "$RESP"
          # Que el trabajo se ponga en rojo si la corrida falla: un fallo en silencio es como no
          # tener reloj. `skipped` es normal (ya se publicó el turno o se llegó al cupo).
          echo "$RESP" | grep -q '"status":"error"' && exit 1
          exit 0
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
